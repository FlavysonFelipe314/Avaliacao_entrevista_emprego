<div class="login-view relative min-h-screen bg-black overflow-hidden">
  <canvas id="matrix-canvas" class="absolute inset-0 w-full h-full"></canvas>
  
  <div class="absolute inset-0 bg-black/90"></div>
  
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-lg">
      <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
          <div class="w-16 h-16 rounded-full border-2 border-emerald-500 flex items-center justify-center bg-emerald-500/10">
            <svg class="w-10 h-10 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-5xl font-bold text-white font-mono mb-2 tracking-wider">
          TACTICAL FLEET
        </h1>
        <p class="text-emerald-500 font-mono text-sm uppercase tracking-widest">SISTEMA DE GESTÃO DE FROTA</p>
      </div>
      
      <!-- Tela de Login -->
      <div id="loginScreen" class="bg-zinc-900/95 border border-emerald-500/30 rounded-lg p-10 backdrop-blur-sm">
        <form id="loginForm" class="space-y-8">
          <div>
            <label for="email" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
              E-MAIL
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="w-full px-6 py-4 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
              placeholder="usuario@tatico.com"
              required
              autocomplete="username"
              autofocus
            />
          </div>
          
          <div>
            <label for="password" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
              SENHA
            </label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="w-full px-6 py-4 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm tracking-widest focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
              placeholder="........"
              required
              autocomplete="current-password"
            />
          </div>
          
          <button 
            type="submit" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-mono py-4 px-6 rounded font-bold tracking-wider transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] hover:shadow-[0_0_20px_rgba(16,185,129,0.5)]"
          >
            ENTRAR
          </button>
        </form>
        
      </div>
    </div>
  </div>
</div>
