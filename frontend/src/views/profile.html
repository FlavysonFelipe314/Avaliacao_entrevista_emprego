<main class="main-content flex-1 transition-all duration-300" style="padding: 2rem; display: flex; justify-content: center; align-items: flex-start;">
  <div class="w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-white font-mono uppercase mb-6">MEU PERFIL</h2>
    
    <!-- Loading State -->
    <div id="profileLoading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-emerald-500"></div>
      <p class="text-zinc-400 font-mono text-sm mt-4">Carregando perfil...</p>
    </div>
    
    <!-- Error State -->
    <div id="profileError" class="bg-red-900/20 border border-red-500/50 rounded-lg p-4 text-red-400 font-mono text-sm mb-4" style="display: none;"></div>
    
    <!-- Profile Form -->
    <div id="profileForm" class="bg-zinc-900 border border-zinc-800 rounded-lg p-6 md:p-8" style="display: none;">
      <form id="profileFormElement" class="space-y-6">
        <div>
          <label class="block text-emerald-500 font-mono text-xs uppercase mb-2">NOME *</label>
          <input id="profile-name" type="text" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500" required />
        </div>
        
        <div>
          <label class="block text-emerald-500 font-mono text-xs uppercase mb-2">E-MAIL *</label>
          <input id="profile-email" type="email" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500" required />
        </div>
        
        <div>
          <label class="block text-emerald-500 font-mono text-xs uppercase mb-2">NOVA SENHA (deixe em branco para manter a atual)</label>
          <input id="profile-password" type="password" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500" placeholder="Mínimo 6 caracteres" />
        </div>
        
        <div class="flex justify-end gap-4">
          <button type="submit" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-black rounded font-mono font-bold text-sm transition-all">
            SALVAR ALTERAÇÕES
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
