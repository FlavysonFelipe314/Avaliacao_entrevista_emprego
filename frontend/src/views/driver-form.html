<div class="driver-form-view bg-black min-h-screen text-white" style="padding: 0; margin: 0;">
  <!-- Header -->
  <header class="bg-zinc-900 border-b border-zinc-800" style="padding: 1.5rem 2rem;">
    <div class="flex justify-between items-center flex-wrap" style="gap: 1rem;">
      <div class="flex items-center" style="gap: 1rem;">
        <button id="sidebar-toggle" class="text-zinc-400 hover:text-emerald-500 transition-colors" style="min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-white font-mono" id="formTitle">NOVO OPERADOR</h1>
          <p class="text-emerald-500 font-mono text-xs uppercase tracking-wider hidden sm:block">CADASTRO_OPERACIONAL</p>
        </div>
      </div>
      <a href="/motoristas" class="flex items-center gap-2 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded font-mono text-sm transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        VOLTAR
      </a>
    </div>
  </header>
  
  <div class="flex">
    <!-- Sidebar -->
    <aside id="tactical-sidebar" class="fixed left-0 top-0 w-64 bg-zinc-900 border-r border-zinc-800 transform -translate-x-full transition-transform duration-300" style="height: 100vh; z-index: 10000;">
      <div class="p-6 border-b border-zinc-800">
        <div class="flex items-center gap-3 text-white">
          <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
          <span class="font-mono text-sm font-bold">TF_OPERATIONS</span>
        </div>
      </div>
      <nav class="p-4 space-y-1">
        <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded text-white hover:bg-emerald-500/10 hover:border-emerald-500/50 hover:text-emerald-500 transition-colors font-mono text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
          DASHBOARD
        </a>
        <a href="/veiculos" class="flex items-center gap-3 px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded text-white hover:bg-emerald-500/10 hover:border-emerald-500/50 hover:text-emerald-500 transition-colors font-mono text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
          </svg>
          VEÍCULOS
        </a>
        <a href="/motoristas" class="flex items-center gap-3 px-4 py-3 bg-emerald-500/20 border border-emerald-500/50 rounded text-emerald-500 font-mono text-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          MOTORISTAS
        </a>
        <a href="/tracking" class="flex items-center gap-3 px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded text-white hover:bg-emerald-500/10 hover:border-emerald-500/50 hover:text-emerald-500 transition-colors font-mono text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
          </svg>
          RASTREIO REAL
        </a>
        <a href="/finance" class="flex items-center gap-3 px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded text-white hover:bg-emerald-500/10 hover:border-emerald-500/50 hover:text-emerald-500 transition-colors font-mono text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          FINANCEIRO
        </a>
      </nav>
    </aside>
    
    <!-- Overlay para mobile -->
    <div class="overlay-sidebar fixed inset-0 bg-black/50 z-9998 hidden"></div>
    
    <!-- Main Content -->
    <main class="main-content flex-1 transition-all duration-300" style="padding: 2rem;">
      <div class="max-w-4xl mx-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-lg" style="padding: 2rem;">
          <form id="driverForm" class="space-y-6">
            <!-- Linha 1: Código e Nome -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="codigo" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  CÓDIGO
                </label>
                <input 
                  type="text" 
                  id="codigo" 
                  name="codigo" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="OP-001 (auto)"
                />
              </div>
              
              <div>
                <label for="nome" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  NOME COMPLETO *
                </label>
                <input 
                  type="text" 
                  id="nome" 
                  name="nome" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="João Silva"
                  required
                />
              </div>
            </div>
            
            <!-- Linha 2: CPF e CNH -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="cpf" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  CPF *
                </label>
                <input 
                  type="text" 
                  id="cpf" 
                  name="cpf" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="000.000.000-00"
                  required
                  maxlength="14"
                />
              </div>
              
              <div>
                <label for="cnh" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  CNH
                </label>
                <input 
                  type="text" 
                  id="cnh" 
                  name="cnh" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="00000000000"
                  maxlength="11"
                />
              </div>
            </div>
            
            <!-- Linha 3: Telefone e Email -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="telefone" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  TELEFONE *
                </label>
                <input 
                  type="tel" 
                  id="telefone" 
                  name="telefone" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="(00) 00000-0000"
                  required
                />
              </div>
              
              <div>
                <label for="email" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  E-MAIL
                </label>
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="joao@email.com"
                />
              </div>
            </div>
            
            <!-- Linha 4: Especialidade e Senha -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="especialidade" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  ESPECIALIDADE
                </label>
                <select 
                  id="especialidade" 
                  name="especialidade" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all"
                >
                  <option value="">Selecione uma especialidade</option>
                  <option value="Transporte de Valores">Transporte de Valores</option>
                  <option value="Escolta Armada">Escolta Armada</option>
                  <option value="Transporte Executivo">Transporte Executivo</option>
                  <option value="Logística">Logística</option>
                  <option value="Suporte">Suporte</option>
                </select>
              </div>
              
              <div>
                <label for="password" class="block text-emerald-500 font-mono text-xs uppercase mb-2 tracking-wider">
                  SENHA
                </label>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="w-full px-4 py-3 bg-black/50 border border-emerald-500/50 rounded text-white font-mono text-sm focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all placeholder:text-zinc-600"
                  placeholder="Mínimo 6 caracteres"
                  minlength="6"
                />
                <p class="text-zinc-500 font-mono text-xs mt-1">Deixe em branco para não alterar</p>
              </div>
            </div>
            
            <!-- Botões -->
            <div class="flex gap-4 pt-4">
              <button 
                type="submit" 
                class="flex-1 md:flex-none px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-black rounded font-mono font-bold text-sm transition-all"
              >
                SALVAR
              </button>
              <a 
                href="/motoristas" 
                class="flex-1 md:flex-none px-8 py-3 bg-zinc-800 hover:bg-zinc-700 text-white rounded font-mono font-bold text-sm transition-all text-center"
              >
                CANCELAR
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
